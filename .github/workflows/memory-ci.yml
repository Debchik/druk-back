name: Memory branch checks

on:
  push:
    branches:
      - danya/memory-system-v1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q app tests settings.py main.py
      - name: Memory tests
        run: pytest -q tests/test_memory_logic.py tests/test_memory_extraction_policy.py tests/test_safety_service.py tests/test_memory_fact_service.py
